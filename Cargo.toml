[package]
name = "moraen"
version = "0.4.1"
edition = "2024"
license = "MIT"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
gilrs = { version = "0.11", optional = true, default-features = false, features = ["xinput"] }

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.release]
debug = 1
